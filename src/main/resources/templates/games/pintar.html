<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintar</title>
    /css/main.css
</head>
<body>

    <nav>
        <b>✦ YachayOff</b>
        /juegosTodos los juegos</a>
    </nav>

    <main class="page">
        <h1>Pintar</h1>

        <p>Elige un color y pinta el recuadro.</p>

        <div class="tile game-box">
            <div id="gameMessage">¡Creatividad en marcha!</div>

            <button onclick="sumarPunto()">
                ¡Jugar!
            </button>

            <p>
                Puntos de esta sesión:
                <strong id="score">0</strong>
            </p>
        </div>
    </main>

    <script>
        let score = 0;

        function sumarPunto() {
            score += 1;

            document.getElementById("score").textContent = score;
            document.getElementById("gameMessage").textContent =
                "¡Creatividad en marcha!";
        }
    </script>

</body>
</html>
