<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la cesta</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <nav>
        <b>✦ YachayOff</b>
        <a href="/juegos">Todos los juegos</a>
    </nav>

    <main class="page">
        <h1>Juego de la cesta</h1>
        
        <p>
            Recoge los objetos imaginarios y suma puntos.
        </p>

        <div class="tile game-box">
            <div id="gameMessage">
                ¡Objeto recogido!
            </div>

            <button onclick="sumarPunto()">
                ¡Jugar!
            </button>

            <p>
                Puntos de esta sesión:
                <strong id="score">0</strong>
            </p>
        </div>
    </main>

    <script>
        let score = 0;

        function sumarPunto() {
            score++;

            document.getElementById("score").textContent = score;
            document.getElementById("gameMessage").textContent =
                "¡Objeto recogido! +" + 1 + " punto";
        }
    </script>

</body>
</html>
