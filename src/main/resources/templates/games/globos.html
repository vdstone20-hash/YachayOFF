<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revienta los globos</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>

    <nav>
        <b>✦ YachayOff</b>
        <a href="/juegos">Todos los juegos</a>
    </nav>

    <main class="page">
        <h1>Revienta los globos</h1>

        <p>Pulsa el botón para sumar puntos.</p>

        <div class="tile game-box">
            <div id="gameMessage">¡Globo alcanzado!</div>

            <button onclick="sumarPunto()">
                ¡Jugar!
            </button>

            <p>
                Puntos de esta sesión:
                <strong id="score">0</strong>
            </p>
        </div>
    </main>
