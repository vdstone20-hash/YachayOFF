
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YachayOff - Iniciar Sesión</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="login-body">

    <div class="login-container">

        <!-- Lado izquierdo: imagen y marca -->
        <div class="login-hero">

            <div class="brand-header">
                <div class="logo-icon">
                    <i data-lucide="graduation-cap"></i>
                </div>

                <h1 class="brand-title">
                    Yachay<span>Off</span>
                </h1>
            </div>

            <p class="brand-subtitle">
                Aprende, juega y descubre el mundo digital.
            </p>

            <div class="hero-image-wrapper">
                <img
                    th:src="@{/img/hero-kid.png}"
                    alt="YachayOff Ilustración"
                    class="hero-img"
                    onerror="this.style.display='none'">
            </div>

            <p class="brand-footer-text">
                La tecnología también puede estar en las escuelas más alejadas.
            </p>

            <div class="mountain-graphic"></div>
        </div>

        <!-- Lado derecho: inicio de sesión -->
        <div class="login-card">

            <h2 class="card-title">Selecciona tu perfil</h2>

            <!-- Mensajes de Spring Security -->
            <div th:if="${param.error}" class="alert-error">
                Usuario o contraseña incorrectos.
            </div>

            <div th:if="${param.logout}" class="alert-success">
                Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" id="loginForm">

                <!-- Token CSRF de Spring Security -->
                <input
                    type="hidden"
                    th:if="${_csrf != null}"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}">

                <!-- Selección de perfil -->
                <div class="profile-options">

                    <label class="profile-option active">
                        <input
                            type="radio"
                            name="role"
                            value="STUDENT"
                            checked
                            onchange="selectRole('STUDENT', this)">

                        <div class="option-icon">
                            <i data-lucide="user"></i>
                        </div>

                        <div class="option-info">
                            <h3>Estudiante</h3>
                            <p>Ingresa con tu código o perfil</p>
                        </div>
                    </label>

                    <label class="profile-option">
                        <input
                            type="radio"
                            name="role"
                            value="TEACHER"
                            onchange="selectRole('TEACHER', this)">

                        <div class="option-icon">
                            <i data-lucide="user-check"></i>
                        </div>

                        <div class="option-info">
                            <h3>Docente</h3>
                            <p>Accede al panel de control</p>
                        </div>
                    </label>

                    <label class="profile-option">
                        <input
                            type="radio"
                            name="role"
                            value="ADMIN"
                            onchange="selectRole('ADMIN', this)">

                        <div class="option-icon">
                            <i data-lucide="shield"></i>
                        </div>

                        <div class="option-info">
                            <h3>Administrador</h3>
                            <p>Configuración del sistema</p>
                        </div>
                    </label>

                </div>

                <!-- Usuario -->
                <div class="input-group">
                    <label for="username">Usuario / Código</label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <!-- Botón -->
                <button type="submit" class="btn-submit">
                    Ingresar
                    <i data-lucide="arrow-right"></i>
                </button>

            </form>
        </div>
    </div>

    <!-- Comportamiento de selección -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            if (window.lucide) {
                lucide.createIcons();
            }

            // Usuarios de prueba asociados a cada perfil
            const usernames = {
                STUDENT: 'estudiante',
                TEACHER: 'docente',
                ADMIN: 'admin'
            };

            window.selectRole = function (role, radio) {

                document.querySelectorAll('.profile-option')
                    .forEach(function (option) {
                        option.classList.remove('active');
                    });

                const selectedOption = radio.closest('.profile-option');

                if (selectedOption) {
                    selectedOption.classList.add('active');
                }

                document.getElementById('username').value =
                    usernames[role] || '';

                // Al cambiar de perfil, limpiar la contraseña anterior
                document.getElementById('password').value = '';
            };

            // Inicializar el perfil seleccionado
            const selectedRadio =
                document.querySelector('input[name="role"]:checked');

            if (selectedRadio) {
                selectRole(selectedRadio.value, selectedRadio);
            }
        });
    </script>

</body>
</html>
